# Default linux/arm64 (Apple Silicon). Intel: BUILD_PLATFORM=linux/amd64 TARGETARCH=amd64
# or: ./scripts/compose-platform.sh > .env
x-platform: &platform ${BUILD_PLATFORM:-linux/arm64}

# Build args: override via .env, env.local.example, or --env-file env.corporate.example
x-build-args: &build-args
  BUILDPLATFORM: ${BUILD_PLATFORM:-linux/arm64}
  TARGETARCH: ${TARGETARCH:-arm64}
  GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

services:
  redis-cart:
    image: redis:alpine
    restart: unless-stopped

    platform: ${BUILD_PLATFORM:-linux/arm64}
  emailservice:
    image: emailservice:5096a85
    platform: *platform
    build:
      context: ./src/emailservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  productcatalogservice:
    image: productcatalogservice:5096a85
    platform: *platform
    build:
      context: ./src/productcatalogservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  recommendationservice:
    image: recommendationservice:5096a85
    platform: *platform
    build:
      context: ./src/recommendationservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on: [productcatalogservice]

  paymentservice:
    image: paymentservice:5096a85
    platform: *platform
    build:
      context: ./src/paymentservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  shippingservice:
    image: shippingservice:5096a85
    platform: *platform
    build:
      context: ./src/shippingservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  currencyservice:
    image: currencyservice:5096a85
    platform: *platform
    build:
      context: ./src/currencyservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  adservice:
    image: adservice:5096a85
    platform: *platform
    build:
      context: ./src/adservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "9555"

  cartservice:
    image: cartservice:5096a85
    platform: *platform
    build:
      context: ./src/cartservice/src
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "7070"
      REDIS_ADDR: redis-cart:6379
    depends_on: [redis-cart]

  checkoutservice:
    image: checkoutservice:5096a85
    platform: *platform
    build:
      context: ./src/checkoutservice
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      DISABLE_PROFILER: "1"
    depends_on: [productcatalogservice, shippingservice, paymentservice, emailservice, currencyservice, cartservice]

  frontend:
    image: frontend:5096a85
    platform: *platform
    build:
      context: ./src/frontend
      platforms:
        - *platform
      args: *build-args
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:80
      ENABLE_PROFILER: "0"
    ports:
      - "8080:8080"
    depends_on: [productcatalogservice, currencyservice, cartservice, recommendationservice, shippingservice, checkoutservice, adservice]
