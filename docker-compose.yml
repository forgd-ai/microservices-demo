x-platform: &platform ${BUILD_PLATFORM:-linux/arm64}

services:
  redis-cart:
    image: redis:alpine
    restart: unless-stopped
    # Redis refuses to start on arm64 kernels it cannot verify as patched
    # for the Linux COW bug (e.g. WSL2); cart data is ephemeral
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]

    platform: ${BUILD_PLATFORM:-linux/arm64}
  emailservice:
    image: emailservice:5096a85
    platform: *platform
    build:
      context: ./src/emailservice
      platforms:
        - *platform
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  productcatalogservice:
    image: productcatalogservice:5096a85
    platform: *platform
    build:
      context: ./src/productcatalogservice
      platforms:
        - *platform
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  recommendationservice:
    image: recommendationservice:5096a85
    platform: *platform
    build:
      context: ./src/recommendationservice
      platforms:
        - *platform
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on: [productcatalogservice]

  paymentservice:
    image: paymentservice:5096a85
    platform: *platform
    build:
      context: ./src/paymentservice
      platforms:
        - *platform
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  shippingservice:
    image: shippingservice:5096a85
    platform: *platform
    build:
      context: ./src/shippingservice
      platforms:
        - *platform
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  currencyservice:
    image: currencyservice:5096a85
    platform: *platform
    build:
      context: ./src/currencyservice
      platforms:
        - *platform
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  adservice:
    image: adservice:5096a85
    platform: *platform
    build:
      context: ./src/adservice
      platforms:
        - *platform
    environment:
      PORT: "9555"

  cartservice:
    image: cartservice:5096a85
    platform: *platform
    build:
      context: ./src/cartservice/src
      platforms:
        - *platform
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
    environment:
      PORT: "7070"
      REDIS_ADDR: redis-cart:6379
    depends_on: [redis-cart]

  checkoutservice:
    image: checkoutservice:5096a85
    platform: *platform
    build:
      context: ./src/checkoutservice
      platforms:
        - *platform
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      DISABLE_PROFILER: "1"
    depends_on:
      [
        productcatalogservice,
        shippingservice,
        paymentservice,
        emailservice,
        currencyservice,
        cartservice,
      ]

  frontend:
    image: frontend:5096a85
    platform: *platform
    build:
      context: ./src/frontend
      platforms:
        - *platform
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:80
      ENABLE_PROFILER: "0"
    ports:
      - "8080:8080"
    depends_on:
      [
        productcatalogservice,
        currencyservice,
        cartservice,
        recommendationservice,
        shippingservice,
        checkoutservice,
        adservice,
      ]
